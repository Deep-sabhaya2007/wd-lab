
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Explorer</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #121212;
            color: white;
        }

        .movie-card {
            background-color: #1e1e1e;
            color: white;
            height: 100%;
        }

        .movie-card img {
            height: 300px;
            object-fit: cover;
        }

        .text-muted {
            color: #aaa !important;
        }

        .form-control {
            background-color: #1e1e1e;
            color: white;
            border: 1px solid #555;
        }

        .form-control::placeholder {
            color: #aaa;
        }

        .form-control:focus {
            background-color: #1e1e1e;
            color: white;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-black">
        <div class="container">

            <a class="navbar-brand" href="#">
                🎬 Movie Explorer
            </a>

            <div>
                <a href="#" class="text-white text-decoration-none me-3">
                    Home
                </a>

                <a href="#movies" class="text-white text-decoration-none">
                    Movies
                </a>
            </div>

        </div>
    </nav>


    <!-- Heading -->
    <div class="container text-center my-5">

        <h1>Movie Explorer</h1>

        <p class="text-muted">
            Explore your favorite movies
        </p>

        <!-- Search -->
        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="input-group">

                    <input type="text"
                        class="form-control"
                        placeholder="Search movie">

                    <button class="btn btn-primary">
                        Search
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- Movies -->
    <div class="container" id="movies">

        <h2 class="mb-4">Popular Movies</h2>

        <div class="row g-4">


            <!-- Movie 1 -->
            <div class="col-md-3 col-sm-6">

                <div class="card movie-card">

                    <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba"
                        class="card-img-top"
                        alt="Movie">

                    <div class="card-body">

                        <h5 class="card-title">
                            Movie One
                        </h5>

                        <p class="card-text text-muted">
                            Action • 2025
                        </p>

                        <p>
                            ⭐ 8.5/10
                        </p>

                        <button class="btn btn-primary">
                            View Details
                        </button>

                    </div>

                </div>

            </div>


            <!-- Movie 2 -->
            <div class="col-md-3 col-sm-6">

                <div class="card movie-card">

                    <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1"
                        class="card-img-top"
                        alt="Movie">

                    <div class="card-body">

                        <h5 class="card-title">
                            Movie Two
                        </h5>

                        <p class="card-text text-muted">
                            Drama • 2024
                        </p>

                        <p>
                            ⭐ 8.2/10
                        </p>

                        <button class="btn btn-primary">
                            View Details
                        </button>

                    </div>

                </div>

            </div>


            <!-- Movie 3 -->
            <div class="col-md-3 col-sm-6">

                <div class="card movie-card">

                    <img src="https://images.unsplash.com/photo-1485846234645-a62644f84728"
                        class="card-img-top"
                        alt="Movie">

                    <div class="card-body">

                        <h5 class="card-title">
                            Movie Three
                        </h5>

                        <p class="card-text text-muted">
                            Comedy • 2025
                        </p>

                        <p>
                            ⭐ 7.9/10
                        </p>

                        <button class="btn btn-primary">
                            View Details
                        </button>

                    </div>

                </div>

            </div>


            <!-- Movie 4 -->
            <div class="col-md-3 col-sm-6">

                <div class="card movie-card">

                    <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c"
                        class="card-img-top"
                        alt="Movie">

                    <div class="card-body">

                        <h5 class="card-title">
                            Movie Four
                        </h5>

                        <p class="card-text text-muted">
                            Sci-Fi • 2026
                        </p>

                        <p>
                            ⭐ 8.8/10
                        </p>

                        <button class="btn btn-primary">
                            View Details
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Footer -->
    <footer class="bg-black text-white text-center mt-5 p-3">

        <p class="mb-0">
            © 2026 Movie Explorer
        </p>

    </footer>

</body>

</html>
