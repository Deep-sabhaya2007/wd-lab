<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieMania</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

  <style>
    body {
      margin: 0;
      background-color: black;
    }

    .box {
      color: #FFD700;
      min-height: 100vh;
      padding: 150px 20px 60px;
      font-size: xx-large;
      font-family: Georgia, 'Times New Roman', Times, serif;

      background:
        linear-gradient(rgba(0, 0, 0, 0.65),
          rgba(0, 0, 0, 0.75)),
        url("./images/Cinematic\ Mosaic\ of\ Worlds.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      text-align: center;
    }

    .start-btn {
      color: #FFD700; 
      /* background-color: rgba(0, 0, 0, 0.5); */background:transparent ;
      border: 2px solid #ffd900;
      border-radius: 10px;
      padding: 12px 35px;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .start-btn:hover {
      color: whitesmoke;
      background-color: #131212c9;
      /* background-color:#FFD700 ; */
      border-color: #FFD700;
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }


    footer {
      background-color: black;
      padding: 35px 7%;
      color: #808080;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    footer a {
      display: block;
      color: #808080;
      text-decoration: none;
      margin-bottom: 12px;
    }

    .navbar-custom {
      background-color: transparent;
      padding: 20px 0;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
    }

    .logo {
      color: red;
      font-family: cursive;
      font-size: 40px;
      font-weight: bold;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-dark navbar-custom">
    <div class="container-fluid px-4 px-md-5">
      <div class="container">
        <a class="navbar-brand" href="#">
          <img src="./images/Movie Mania Gothic Neon Logo.png" width="300" >
        </a>
      </div>
    </div>
  </nav>

  <div class="box">
    <h1 class="display-1 fw-bold">
      <div>WELCOME</div>
      <div>TO</div>
      <div>MOVIE MANIA</div>
    </h1>

    <div class="mt-5">
      <a href="./home.html">
        <button type="button" class="start-btn">
          Get Started ❯
        </button>
      </a>
    </div>
  </div>

  <footer id="footer">
    <p class="mb-0">
      © 2026 MovieMania. A movie discovery website.
    </p>

    <div>
      <a href="./feedback.html">Feedback</a>
      <a href="./about">About Us</a>
      <a href="#">Contact Us</a>
    </div>
  </footer>

</body>

</html>
