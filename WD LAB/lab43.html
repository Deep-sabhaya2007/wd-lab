<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration</title>
</head>

<body>
    <form>
        <table>
            <h2>Employee Registration</h2>
            <tr>
                <td><label>Employee Id :</label></td>
                <td><input type="text" placeholder="Enter Employee Id"></input></td>

                <td><label>Employee Name :</label></td>
                <td><input type="text" placeholder="Enter Employee Name"></input></td>
            </tr>
            <tr>
                <td><label>Email :</label></td>
                <td><input type="email" placeholder="Enter Emale"></input></td>

                <td><label>Contact No :</label></td>
                <td><input type="tel-" pattern="[0-9]{10}" placeholder="Enter Contact No"></input></td>
            </tr>
            <tr>
                <td><label>Marital Status</label></td>
                <td><input type="radio" name="Status"><label>singel</label></input>
                    <input type="radio" name="Status"><label>Female</label></input>
                </td>
            </tr>
            <tr>
                <td>
                    <h2>Education Qualification</h2>
                </td>
            </tr>

            <tr>
                <td><label>Education :</label></td>
                <td><input type="text" placeholder="Enter Education details"></input></td>

                <td><label>Experience :</label></td>
                <td><input type="number" placeholder="Enter Employee Name"></input></td>
            </tr>
            <tr>
                <td>
                    <h2>Job Details</h2>
                </td>
            </tr>
            <tr>
                <td><label>Designation :</label></td>
                <td><input type="text" placeholder="Enter Designation Details"></input></td>

                <td><label>Job Location :</label></td>
                <td><input type="text" placeholder="Enter Employee Name"></input></td>
            </tr>

        </table>
    </form>
</body>

</html>
