<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form 1</title>
</head>

<body>
    <h1>Student Registration</h1>
    <form>
        <table>
            <tr>
                <td><label>Full Name</label></td>
                <td><input type="text"></input></td>
            </tr>
            <tr>
                <td><label>Email</label></td>
                <td><input type="email"></input></td>
            </tr>
            <tr>
                <td><label>Mobile No</label></td>
                <td><input type="tel-" pattern="[0-9]{10}"></input></td>
            </tr>
            <tr>
                <td><label>Address</label></td>
                <td><textarea name="" id=""></textarea></td>
            </tr>
            <tr>
                <td><label> Nationality</label></td>
                <td><input type="text"></input></td>
            </tr>
            <tr>
                <td><label>Date of Birth</label></td>
                <td><input type="Date"></input></td>
            </tr>

            <tr>
                <td><label>Gender</label></td>
                <td><input type="radio" id="Male" value="Male" name="Gender"><label>Male</label></input>
                    <input type="radio" id="Female" value="Female" name="Gender"><label>Female</label></input>
                </td>
            </tr>
            <tr>
                <td><label for="Degree">Heighest Degree</label></td>

                <td>
                    <select>
                        <option Selected disabled>Select Degree</option>
                        <option>B.Tech CSE</option>
                        <option>B.Tech CE</option>
                        <option>B.Tech IT</option>
                        <option>B.Tech Mathametics</option>
                    </select>
                </td>
            <tr>
                <td><label>CPI</label></td>
                <td><input type="text"></input></td>
            </tr>
            <tr>
                <td><label>University</label></td>
                <td><input type="text"></input></td>
            </tr>
            <tr>
                <td><label>Passing Year</label></td>

                <td>
                    <select>
                        <option Selected disabled>Select year</option>
                        <option>2022</option>
                        <option>2023</option>
                        <option>2024</option>
                        <option>2025</option>

                    </select>
                </td>
            <tr>
                <td>
                    <button type="submit">Sunbmit</button>
                </td>
                <td>
                    <button type="reset">Cancel</button>
                </td>
            </tr>

        </table>


    </form>
</body>

</html>
