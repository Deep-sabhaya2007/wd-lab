<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #page {
        background-color: rgb(176, 255, 229);
        height: 500px;
        padding: 10px;
    }

    #Header {
        background-color: rgb(246, 7, 7);
        height: 30px;
    }

    #Content {
        background-color: rgb(249, 237, 8);
        height: 434px;
        padding: 20px;
        color: white;
    }

    .Entry {
        background-color: rgb(85, 85, 85);
        margin: 10px;
        padding: 10px;
        width: 600px;
    }

    .Sidebar {
        float: right;
        background-color: rgb(125, 124, 124);
        height: 200px;
        width: 600px;
        padding: 20px;
    }

    #left {
        float: left;
    }

    #footer {
        background-color: blue;
    }

    @media screen and (min-width:100px) and (max-width:900px) and (min-height:500px) {
        #Content {
            background-color: bisque;
            text-decoration-color: white;
        }

        .Sidebar {
            width: auto;
            height: auto;
        }

        .Entry {
            height: auto;
            width: auto;
        }

    }
</style>


<body>
    <div id="page">page
        <div id="Header">Header
        </div>

        <div id="Content">
            <div>Content</div>

            <div id="left">
                <div class="Entry">Entry</div>
                <div class="Entry">Entry</div>
                <div class="Entry">Entry</div>
            </div>

            <div class="Sidebar">Sidebar</div>


        </div>


    </div>
    <div id="footer">&copy Dershan Univercity</div>
</body>

</html>
